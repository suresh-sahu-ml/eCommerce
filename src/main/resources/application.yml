spring:
  application:
    name: perfume-shop
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 20
          fetch_size: 50
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${DB_USERNAME:system}
    password: ${DB_PASSWORD:OraclePass123}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  liquibase:
    enabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/perfume-shop}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/perfume-shop/protocol/openid-connect/certs}

logging:
  level:
    root: INFO
    com.perfumeshop: DEBUG
    org.springframework.web: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

jwt:
  secret: ${JWT_SECRET:your-secret-key-change-this-in-production-with-at-least-32-characters-long}
  expiration: ${JWT_EXPIRATION:86400000}

server:
  port: 8080
  servlet:
    context-path: /api

file:
  upload:
    path: ./uploads/images
    max-size: 5242880

razorpay:
  key:
    id: ${RAZORPAY_KEY_ID:rzp_test_TRJfYUEFZ7igQa}
    secret: ${RAZORPAY_KEY_SECRET:PCa1aatzjhn8OftPkrnLdKux}

resend:
  enabled: ${RESEND_ENABLED:false}
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:noreply@perfumeshop.com}
